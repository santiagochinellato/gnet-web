<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Gnet">
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: block; }
    }
  </style>
  <image class="light" href="data:image/png;base64," width="96" height="96"/>
  <image class="dark" href="data:image/png;base64," width="96" height="96"/>
</svg>
